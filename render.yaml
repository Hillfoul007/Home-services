services:
  - type: web
    name: laundrify
    env: node
    plan: starter
    
    # Build configuration
    buildCommand: npm run render:build
    startCommand: npm run render:start
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=300
      - key: RENDER
        value: "true"
      - key: ENABLE_PWA
        value: "false"
    
    # Build settings
    buildFilter:
      paths:
        - src/**
        - backend/**
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
    
    # Deployment settings
    maxBuildDurationMinutes: 20
    healthCheckPath: /
    
    # Scaling
    numInstances: 1
    
    # Timeout
    maxInstanceLifespan: 2880
